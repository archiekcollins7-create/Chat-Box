<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_CHAT // CLOUD_TERMINAL</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    
    body {
      background-color: #030305;
      color: #00ff66;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-image: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 0, 255, 0.04));
      background-size: 100% 4px, 6px 100%;
    }

    .cyber-shell {
      width: 96vw;
      height: 94vh;
      background: rgba(8, 12, 10, 0.98);
      border: 2px solid #00ff66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
      display: flex;
      flex-direction: column;
      padding: 25px;
    }

    .shell-header {
      border-bottom: 2px dashed #00ff66;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .header-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .header-right button {
      width: auto;
      padding: 6px 14px;
      margin-top: 0;
      font-size: 0.8rem;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 650px;
      margin: auto;
      width: 100%;
    }

    .hidden { display: none !important; }

    h2, h3 {
      margin-bottom: 20px;
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 1.6rem;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      background: #000;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-size: 1.1rem;
      outline: none;
      border-radius: 0;
    }

    input:focus, select:focus {
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
    }

    button {
      background: #00ff66;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: 0.2s;
    }

    button:hover {
      background: #00cc52;
      box-shadow: 0 0 20px #00ff66;
    }

    .btn-alt {
      background: transparent;
      color: #00ff66;
    }

    .btn-alt:hover {
      background: rgba(0, 255, 102, 0.15);
      color: #00ff66;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
    }

    #error-msg {
      color: #ff3333;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.6);
      margin-top: 15px;
      font-size: 1rem;
      text-align: center;
    }

    /* Full Screen Chat Layout */
    #chat-screen {
      max-width: 100%;
      height: 100%;
      justify-content: flex-start;
    }

    .chat-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #051a0c;
      padding: 12px 20px;
      border: 1px solid #00ff66;
      margin-bottom: 15px;
    }

    .chat-topbar button {
      width: auto;
      padding: 8px 16px;
      margin-top: 0;
      font-size: 0.9rem;
    }

    #messages-container {
      flex: 1;
      background: #020803;
      border: 1px solid #003311;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-bubble {
      background: #0d2614;
      border-left: 4px solid #00ff66;
      padding: 12px 16px;
      max-width: 70%;
      word-break: break-word;
      font-size: 1.05rem;
    }

    .msg-bubble.mine {
      background: #14331e;
      border-left-color: #00ffff;
      align-self: flex-end;
    }

    .msg-bubble small {
      display: block;
      font-size: 0.75rem;
      opacity: 0.6;
      margin-bottom: 4px;
    }

    .send-box {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .send-box input {
      margin-top: 0;
    }

    .send-box button {
      width: 160px;
      margin-top: 0;
    }

    /* Modal Overlays */
    .cyber-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: #080d0a;
      border: 2px solid #00ff66;
      padding: 30px;
      width: 450px;
      box-shadow: 0 0 25px rgba(0,255,102,0.4);
    }
  </style>
</head>
<body>

  <div class="cyber-shell">
    <div class="shell-header">
      <span>SYS_ID: SECURE_CHAT_v6.0_CLOUD</span>
      <div class="header-right">
        <span id="status-user" style="color: #00ffff;">STATUS: OFFLINE</span>
        <button id="logout-btn" class="btn-alt hidden" onclick="logoutUser()">LOGOUT</button>
      </div>
    </div>

    <!-- 1. AUTH SCREEN -->
    <div class="screen" id="auth-screen">
      <h2>AUTHENTICATION REQUIRED</h2>
      <input type="text" id="username" placeholder="ENTER USERNAME" autocomplete="off">
      <input type="password" id="password" placeholder="ENTER PASSWORD">
      <button onclick="handleAuth('login')">ACCESS TERMINAL</button>
      <button class="btn-alt" onclick="handleAuth('register')">REGISTER NEW USER</button>
      <div id="error-msg"></div>
    </div>

    <!-- 2. ROOM SCREEN -->
    <div class="screen hidden" id="room-screen">
      <h2>SELECT PROTOCOL ROOM</h2>
      <select id="room-select">
        <option value="General" data-code="">General (Public)</option>
      </select>
      <button onclick="tryEnterRoom()">CONNECT TO SELECTED ROOM</button>
      <button class="btn-alt" onclick="openJoinCodeModal()">[+] JOIN ROOM VIA CODE</button>
      
      <hr style="border:0; border-top:1px dashed #00ff66; margin:25px 0; width:100%;">
      
      <h3 style="font-size: 1.1rem;">CREATE SECURE ROOM</h3>
      <input type="text" id="new-room-name" placeholder="NEW ROOM NAME" autocomplete="off">
      <input type="password" id="new-room-code" placeholder="SET NUMERIC ACCESS CODE (OPTIONAL)">
      <button class="btn-alt" onclick="createRoom()">INITIALIZE & JOIN ROOM</button>
      <div id="room-error" style="color: #ff3333; font-size: 0.9rem; margin-top: 10px; text-align: center;"></div>
    </div>

    <!-- 3. CHAT SCREEN -->
    <div class="screen hidden" id="chat-screen">
      <div class="chat-topbar">
        <div>
          <span id="active-room-title" style="font-size: 1.1rem; letter-spacing: 1px;">ROOM: GENERAL</span>
          <span id="active-room-secret" style="display: block; font-size: 0.8rem; color: #00ffff; margin-top: 4px;"></span>
        </div>
        <button class="btn-alt" onclick="leaveRoom()">DISCONNECT</button>
      </div>
      <div id="messages-container"></div>
      <form class="send-box" onsubmit="sendMessage(event)">
        <input type="text" id="msg-input" placeholder="TYPE TRANSMISSION..." autocomplete="off" required>
        <button type="submit">TRANSMIT</button>
      </form>
    </div>

  </div>

  <!-- PASSWORD ENTRY MODAL -->
  <div id="code-modal" class="cyber-modal hidden">
    <div class="modal-box">
      <h3>SECURE ROOM ACCESS</h3>
      <p style="font-size: 0.9rem; margin-bottom: 15px; color: #aaffcc;">This room requires a security code.</p>
      <input type="password" id="modal-code-input" placeholder="ENTER ACCESS CODE">
      <button onclick="verifyRoomCode()" style="margin-top: 20px;">AUTHENTICATE</button>
      <button class="btn-alt" onclick="closeModal()" style="margin-top: 10px;">CANCEL</button>
      <div id="modal-error" style="color: #ff3333; font-size: 0.9rem; margin-top: 10px;"></div>
    </div>
  </div>

  <!-- DIRECT JOIN VIA CODE MODAL -->
  <div id="direct-code-modal" class="cyber-modal hidden">
    <div class="modal-box">
      <h3>JOIN ROOM BY CODE</h3>
      <p style="font-size: 0.9rem; margin-bottom: 15px; color: #aaffcc;">Enter the exact room name and code.</p>
      <input type="text" id="direct-room-name-input" placeholder="EXACT ROOM NAME" autocomplete="off">
      <input type="password" id="direct-room-code-input" placeholder="ROOM NUMBER CODE" style="margin-top: 10px;">
      <button onclick="joinRoomByCode()" style="margin-top: 20px;">CONNECT</button>
      <button class="btn-alt" onclick="closeDirectModal()" style="margin-top: 10px;">CANCEL</button>
      <div id="direct-modal-error" style="color: #ff3333; font-size: 0.9rem; margin-top: 10px;"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // PASTE YOUR FIREBASE CONFIGURATION HERE:
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = '';
    let currentRoom = '';
    let pendingRoom = '';
    let unsubscribeMessages = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('cyber_logged_in_user');
      if (savedUser) {
        currentUser = savedUser;
        document.getElementById('status-user').textContent = `USER: ${currentUser.toUpperCase()}`;
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('room-screen').classList.remove('hidden');
        loadRoomsDropdown();
      }
    });

    async function handleAuth(action) {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.textContent = '';

      if (!user || !pass) {
        err.textContent = '[ERROR] ALL FIELDS REQUIRED.';
        return;
      }

      const userRef = db.collection('users').doc(user);
      const doc = await userRef.get();

      if (action === 'register') {
        if (doc.exists) {
          err.textContent = '[ERROR] USERNAME ALREADY EXISTS.';
          return;
        }
        await userRef.set({ password: pass });
        alert('[SUCCESS] USER REGISTERED. YOU MAY NOW LOGIN.');
      } else {
        if (!doc.exists || doc.data().password !== pass) {
          err.textContent = '[ERROR] ACCESS DENIED: INVALID CREDENTIALS.';
          return;
        }
        currentUser = user;
        localStorage.setItem('cyber_logged_in_user', currentUser);
        
        document.getElementById('status-user').textContent = `USER: ${currentUser.toUpperCase()}`;
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('room-screen').classList.remove('hidden');
        loadRoomsDropdown();
      }
    }

    function logoutUser() {
      localStorage.removeItem('cyber_logged_in_user');
      currentUser = '';
      if (unsubscribeMessages) unsubscribeMessages();
      document.getElementById('status-user').textContent = 'STATUS: OFFLINE';
      document.getElementById('logout-btn').classList.add('hidden');
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('room-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    async function loadRoomsDropdown() {
      const select = document.getElementById('room-select');
      const snapshot = await db.collection('rooms').get();
      select.innerHTML = '<option value="General" data-code="">General (Public)</option>';
      
      snapshot.forEach(doc => {
        if (doc.id !== 'General') {
          const data = doc.data();
          const opt = document.createElement('option');
          opt.value = doc.id;
          opt.textContent = doc.id + (data.code ? ' [SECURE]' : '');
          opt.dataset.protected = data.code ? 'true' : 'false';
          select.appendChild(opt);
        }
      });
    }

    async function createRoom() {
      const name = document.getElementById('new-room-name').value.trim();
      const code = document.getElementById('new-room-code').value;
      const errDiv = document.getElementById('room-error');
      errDiv.textContent = '';

      if (!name) {
        errDiv.textContent = '[ERROR] ENTER A ROOM NAME.';
        return;
      }

      const roomRef = db.collection('rooms').doc(name);
      const doc = await roomRef.get();
      if (doc.exists) {
        errDiv.textContent = '[ERROR] ROOM ALREADY EXISTS.';
        return;
      }

      await roomRef.set({ code: code });
      document.getElementById('new-room-name').value = '';
      document.getElementById('new-room-code').value = '';
      await loadRoomsDropdown();

      enterRoom(name, code);
    }

    async function tryEnterRoom() {
      const select = document.getElementById('room-select');
      const selectedOpt = select.options[select.selectedIndex];
      if (!selectedOpt) return;

      pendingRoom = selectedOpt.value;
      const isProtected = selectedOpt.dataset.protected === 'true';

      if (pendingRoom === 'General') {
        enterRoom('General', '');
        return;
      }

      if (isProtected) {
        document.getElementById('modal-code-input').value = '';
        document.getElementById('modal-error').textContent = '';
        document.getElementById('code-modal').classList.remove('hidden');
      } else {
        const doc = await db.collection('rooms').doc(pendingRoom).get();
        enterRoom(pendingRoom, doc.data().code);
      }
    }

    async function verifyRoomCode() {
      const inputCode = document.getElementById('modal-code-input').value;
      const doc = await db.collection('rooms').doc(pendingRoom).get();

      if (doc.exists && doc.data().code === inputCode) {
        closeModal();
        enterRoom(pendingRoom, doc.data().code);
      } else {
        document.getElementById('modal-error').textContent = '[ACCESS DENIED] INVALID CODE.';
      }
    }

    function closeModal() {
      document.getElementById('code-modal').classList.add('hidden');
      pendingRoom = '';
    }

    function openJoinCodeModal() {
      document.getElementById('direct-room-name-input').value = '';
      document.getElementById('direct-room-code-input').value = '';
      document.getElementById('direct-modal-error').textContent = '';
      document.getElementById('direct-code-modal').classList.remove('hidden');
    }

    function closeDirectModal() {
      document.getElementById('direct-code-modal').classList.add('hidden');
    }

    async function joinRoomByCode() {
      const rName = document.getElementById('direct-room-name-input').value.trim();
      const rCode = document.getElementById('direct-room-code-input').value;
      const errDiv = document.getElementById('direct-modal-error');
      errDiv.textContent = '';

      const doc = await db.collection('rooms').doc(rName).get();
      if (!doc.exists) {
        errDiv.textContent = '[ERROR] ROOM DOES NOT EXIST.';
        return;
      }

      if (doc.data().code !== rCode) {
        errDiv.textContent = '[ACCESS DENIED] INVALID CODE.';
        return;
      }

      closeDirectModal();
      enterRoom(rName, rCode);
    }

    function enterRoom(roomName, code) {
      currentRoom = roomName;
      document.getElementById('room-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('active-room-title').textContent = `ROOM: ${currentRoom.toUpperCase()}`;
      
      const secretDisplay = document.getElementById('active-room-secret');
      if (code) {
        secretDisplay.textContent = `[PRIVATE ACCESS CODE: ${code}]`;
      } else {
        secretDisplay.textContent = '[PUBLIC PROTOCOL - NO CODE REQUIRED]';
      }

      listenToMessages();
    }

    function leaveRoom() {
      if (unsubscribeMessages) unsubscribeMessages();
      document.getElementById('chat-screen').classList.add('hidden');
      document.getElementById('room-screen').classList.remove('hidden');
      loadRoomsDropdown();
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      await db.collection('rooms').doc(currentRoom).collection('messages').add({
        user: currentUser,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = '';
    }

    function listenToMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (unsubscribeMessages) unsubscribeMessages();

      unsubscribeMessages = db.collection('rooms').doc(currentRoom)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          container.innerHTML = '';
          snapshot.forEach(doc => {
            const m = doc.data();
            const div = document.createElement('div');
            div.className = 'msg-bubble' + (m.user === currentUser ? ' mine' : '');
            div.innerHTML = `<small>${m.user}</small>${m.text}`;
            container.appendChild(div);
          });
          container.scrollTop = container.scrollHeight;
        });
    }
  </script>
</body>
</html>
