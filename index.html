<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat Box</title>
  <style>
    /* CSS Styling */
    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 400px;
      height: 500px;
      background-color: #2b2b36;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .chat-header {
      background-color: #3a3a48;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background-color: #4f46e5;
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .chat-input-area {
      display: flex;
      padding: 10px;
      background-color: #3a3a48;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      outline: none;
      background-color: #1e1e24;
      color: white;
    }

    .chat-input-area button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .chat-input-area button:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">My Chat Box</div>
    
    <!-- Messages box where chats appear -->
    <div class="chat-messages" id="messages-box"></div>
    
    <!-- Input form to type and send messages -->
    <form class="chat-input-area" id="chat-form">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // JavaScript Logic
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const messagesBox = document.getElementById('messages-box');

    // Load saved messages from the browser when the page opens
    let messages = JSON.parse(localStorage.getItem('myChatMessages')) || [];
    renderMessages();

    // Listen for when the user clicks "Send" or presses Enter
    chatForm.addEventListener('submit', function(event) {
      event.preventDefault(); // Stop page from refreshing
      
      const text = messageInput.value.trim();
      if (text === '') return;

      // Add new message to our array
      messages.push(text);
      
      // Save to browser memory so it stays when you close the tab
      localStorage.setItem('myChatMessages', JSON.stringify(messages));

      // Refresh the chat box display and clear input
      renderMessages();
      messageInput.value = '';
    });

    // Function to display messages on the screen
    function renderMessages() {
      messagesBox.innerHTML = '';
      messages.forEach(function(msg) {
        const div = document.createElement('div');
        div.classList.add('message');
        div.textContent = msg;
        messagesBox.appendChild(div);
      });
      
      // Automatically scroll down to the newest message
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // Sync messages across different browser tabs automatically
    window.addEventListener('storage', function(event) {
      if (event.key === 'myChatMessages') {
        messages = JSON.parse(event.newValue) || [];
        renderMessages();
      }
    });
  </script>

</body>
</html>
