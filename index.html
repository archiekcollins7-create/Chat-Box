<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { width: 100%; max-width: 400px; background: #1e1e24; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: none; outline: none; }
    input, select { background: #2b2b36; color: #fff; }
    button { background: #4f46e5; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #4338ca; }
    .hidden { display: none !important; }
    #error { color: #ff4d4d; font-size: 0.85rem; margin-top: 8px; text-align: center; }
    #chat-box { max-width: 500px; height: 500px; display: flex; flex-direction: column; }
    #messages { flex: 1; background: #121212; padding: 10px; border-radius: 4px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .msg { background: #2f2f3b; padding: 6px 10px; border-radius: 4px; word-break: break-word; }
    .msg.mine { background: #4f46e5; align-self: flex-end; }
    .msg small { display: block; font-size: 0.7rem; opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="box" id="auth-box">
    <h2>Chat Login</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button onclick="auth('login')">Log In</button>
    <button onclick="auth('register')" style="background: #3a3a48;">Register</button>
    <div id="error"></div>
  </div>

  <!-- Room Screen -->
  <div class="box hidden" id="room-box">
    <h2>Select Room</h2>
    <select id="room-list"></select>
    <button onclick="joinRoom()">Join Room</button>
    <hr style="border:0; border-top:1px solid #3a3a48; margin:15px 0;">
    <input type="text" id="new-room" placeholder="New room name...">
    <button onclick="createRoom()" style="background: #3a3a48;">Create Room</button>
  </div>

  <!-- Chat Screen -->
  <div class="box hidden" id="chat-box">
    <h3 id="room-title" style="margin-bottom: 10px;">Room</h3>
    <div id="messages"></div>
    <form style="display: flex; gap: 6px; margin-top: 10px;" onsubmit="send(event)">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required style="margin-top:0;">
      <button type="submit" style="margin-top:0; width: 80px;">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUser = '', myRoom = '';

    function auth(action) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return;
      socket.emit('auth', { username, password, action });
    }

    socket.on('auth-success', ({ username, rooms }) => {
      myUser = username;
      updateRooms(rooms);
      document.getElementById('auth-box').classList.add('hidden');
      document.getElementById('room-box').classList.remove('hidden');
    });

    socket.on('auth-error', (err) => { document.getElementById('error').textContent = err; });
    socket.on('update-rooms', updateRooms);

    function updateRooms(rooms) {
      const sel = document.getElementById('room-list');
      sel.innerHTML = '';
      rooms.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        sel.appendChild(opt);
      });
    }

    function createRoom() {
      const name = document.getElementById('new-room').value.trim();
      if (name) socket.emit('create-room', name);
      document.getElementById('new-room').value = '';
    }

    function joinRoom() {
      myRoom = document.getElementById('room-list').value;
      document.getElementById('room-box').classList.add('hidden');
      document.getElementById('chat-box').classList.remove('hidden');
      document.getElementById('room-title').textContent = `Room: ${myRoom}`;
      document.getElementById('messages').innerHTML = '';
      socket.emit('join-room', { room: myRoom, username: myUser });
    }

    function send(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      if (!input.value.trim()) return;
      socket.emit('chat-message', { room: myRoom, username: myUser, text: input.value.trim() });
      input.value = '';
    }

    socket.on('load-history', (history) => history.forEach(addMsg));
    socket.on('message', addMsg);

    function addMsg(data) {
      const div = document.createElement('div');
      div.className = 'msg' + (data.user === myUser ? ' mine' : '');
      div.innerHTML = `<small>${data.user}</small>${data.text}`;
      const box = document.getElementById('messages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
